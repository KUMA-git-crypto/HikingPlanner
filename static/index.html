<!DOCTYPE html>
<html lang="ja">
<head>
    <title>登山道ルートプランナー</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; }

        #controls {
            position: absolute; top: 10px; right: 10px; z-index: 1001;
            background: white; padding: 14px; border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.25); width: 250px;
        }
        h3 { margin: 0 0 10px; font-size: 16px; color: #222; }
        .info { font-size: 13px; margin-bottom: 10px; line-height: 1.5; color: #444; }
        button {
            cursor: pointer; padding: 10px; width: 100%;
            border: none; border-radius: 6px; font-size: 13px;
            font-weight: bold; margin-bottom: 6px; color: white;
        }
        #fetchBtn { background: #2196F3; }
        #fetchBtn:disabled { background: #90CAF9; cursor: not-allowed; }
        #undoBtn { background: #FF9800; } 
        #resetBtn { background: #757575; }
        #gpxBtn, #kmlBtn { background: #4CAF50; }
        .radius-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; }
        .radius-row input { flex:1; }

        #loadingBar {
            display: none; width: 100%; height: 4px; background: #e0e0e0;
            border-radius: 2px; margin-bottom: 8px; overflow: hidden;
        }
        #loadingBar.active { display: block; }
        #loadingBar::after {
            content: ''; display: block; width: 40%; height: 100%;
            background: #2196F3; border-radius: 2px;
            animation: slide 1s ease-in-out infinite;
        }
        @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

        #waypointList { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; font-size: 12px; color: #555; }
        .area-badge {
            display: inline-block; background: #e3f2fd; color: #1565c0;
            border-radius: 4px; padding: 2px 7px; font-size: 11px; margin: 2px 2px 0 0;
        }
    </style>
</head>
<body>
<div id="controls">
    <h3>⛰️ 登山道ルートプランナー</h3>
    <div id="loadingBar"></div>
    <div class="info" id="status">地図を移動して「この付近を取得」を押してください。</div>
    <button id="fetchBtn" onclick="fetchCurrentArea()">📥 この付近の登山道を取得</button>
    <button id="undoBtn" onclick="undoLast()">↩️ 一つ戻す</button>
    <button id="resetBtn" onclick="resetAll()">🗑️ リセット</button>
    <button id="gpxBtn" onclick="exportRoute('gpx')">⬇️ GPXで保存</button>
    <button id="kmlBtn" onclick="exportRoute('kml')">⬇️ KMLで保存</button>
    <div id="waypointList" style="margin-top:10px; border-top:1px solid #eee; padding-top:8px; font-size:12px; color:#555;">
        <strong>通過ポイント：</strong>
        <div id="listItems">まだありません</div>
    </div>
    <div style="margin-top:8px; border-top:1px solid #eee; padding-top:6px; display:flex; align-items:center; gap:6px; font-size:12px;">
        <span>半径:</span>
        <input id="radiusSlider" type="range" min="3" max="20" value="10" style="flex:1">
        <span id="radiusLabel" style="min-width:32px">10km</span>
    </div>
</div>

<div id="map"></div>

<script>
// ─── MAP SETUP ────────────────────────────────────────────────────────────────
const map = L.map('map').setView([35.3606, 138.7273], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

const edgeLayer  = L.layerGroup().addTo(map);
const nodeLayer  = L.layerGroup().addTo(map);
const statusEl   = document.getElementById('status');
const loadingBar = document.getElementById('loadingBar');

let radiusCircle = null;   // Visual circle showing fetch range

// Update radius label and circle
const slider = document.getElementById('radiusSlider');
const rlabel = document.getElementById('radiusLabel');
function updateRadiusCircle() {
    const r = parseInt(slider.value) * 1000;
    rlabel.textContent = slider.value + 'km';
    const c = map.getCenter();
    if (radiusCircle) map.removeLayer(radiusCircle);
    radiusCircle = L.circle([c.lat, c.lng], {
        radius: r, color: '#2196F3', weight: 1.5,
        fill: false, dashArray: '6,6', interactive: false
    }).addTo(map);
}
slider.addEventListener('input', updateRadiusCircle);
map.on('move', updateRadiusCircle);
updateRadiusCircle();

// ─── CLIENT-SIDE GRAPH ───────────────────────────────────────────────────────
// nodes: { "nodeId": [lat, lon] }
// edges: { "nodeId": [ {to, dist}, ... ] }
let graphNodes = {};
let graphEdges = {};
let renderedEdges = new Set(); // Store "u-v" keys of already drawn segments

function mergeTrailData(data) {
    // All nodes go into graphNodes for Dijkstra (routing needs intermediate nodes)
    for (const [id, pos] of Object.entries(data.n)) { graphNodes[id] = pos; }
    for (const e of data.e) {
        if (!graphEdges[e.u]) graphEdges[e.u] = [];
        graphEdges[e.u].push({ to: e.v, dist: e.d });
    }
    // Render edges
    for (const e of data.e) {
        // Use a composite key to avoid redrawing the same physical segment
        const key = [e.u, e.v].sort().join('-');
        if (renderedEdges.has(key)) continue;
        renderedEdges.add(key);

        if (e.c && e.c.length >= 2) {
            const latlngs = e.c.map(([ln, lt]) => [lt, ln]);
            const isConnector = e.t === 1;
            L.polyline(latlngs, {
                color: isConnector ? '#9E9E9E' : '#4CAF50',
                weight: isConnector ? 1.5 : 2.5,
                opacity: isConnector ? 0.4 : 0.75,
                dashArray: isConnector ? '4,6' : null,
                interactive: false
            }).addTo(edgeLayer);
        }
    }
    // Only show circles at junction/endpoint nodes (from server's `jn` list)
    const junctionSet = new Set(data.jn || []);
    for (const [id, pos] of Object.entries(data.n)) {
        if (!junctionSet.has(id)) continue;  // skip intermediate nodes
        const marker = L.circleMarker([pos[0], pos[1]], {
            radius: 5, fillColor: 'white', color: '#333',
            weight: 1.5, opacity: 0.9, fillOpacity: 0.95
        });
        marker.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            handleNodeClick(id, pos[0], pos[1]);
        });
        marker.addTo(nodeLayer);
    }
}



// ─── AREA FETCHING ────────────────────────────────────────────────────────────
async function fetchCurrentArea() {
    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    loadingBar.classList.add('active');
    statusEl.textContent = '登山道データを取得中...';

    const c = map.getCenter();
    const radius = parseInt(document.getElementById('radiusSlider').value);

    try {
        const res = await fetch(`/fetch-area?lat=${c.lat.toFixed(5)}&lon=${c.lng.toFixed(5)}&radius=${radius}`);
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || `HTTP ${res.status}`); }
        const data = await res.json();
        mergeTrailData(data);
        const nc = Object.keys(data.n).length;
        const ec = data.e.filter(e => e.t === 0).length;
        statusEl.textContent = `取得完了！ 分岐点: ${nc}, 道の区間: ${ec}　白丸をクリックしてください。`;
    } catch (e) {
        statusEl.textContent = 'エラー: ' + e.message;
    } finally {
        btn.disabled = false;
        loadingBar.classList.remove('active');
    }
}

function updateAreaBadges() {
    const container = document.getElementById('areaBadges');
    container.innerHTML = loadedBBoxes.map((b, i) =>
        `<span class="area-badge">エリア ${i+1}</span>`
    ).join('');
}

// ─── MIN-HEAP DIJKSTRA ────────────────────────────────────────────────────────
class MinHeap {
    constructor() { this.data = []; }
    push(val, p) { this.data.push({val, p}); this._up(this.data.length - 1); }
    pop() {
        const top = this.data[0]; const bot = this.data.pop();
        if (this.data.length > 0) { this.data[0] = bot; this._down(0); }
        return top;
    }
    _up(i) {
        while (i > 0) {
            const par = (i - 1) >> 1;
            if (this.data[par].p <= this.data[i].p) break;
            [this.data[i], this.data[par]] = [this.data[par], this.data[i]]; i = par;
        }
    }
    _down(i) {
        const n = this.data.length;
        while (true) {
            let s = i, l = 2*i+1, r = 2*i+2;
            if (l < n && this.data[l].p < this.data[s].p) s = l;
            if (r < n && this.data[r].p < this.data[s].p) s = r;
            if (s === i) break;
            [this.data[i], this.data[s]] = [this.data[s], this.data[i]]; i = s;
        }
    }
    get isEmpty() { return this.data.length === 0; }
}

function dijkstra(startId, endId, edgePenalties = {}) {
    const dist = { [startId]: 0 };
    const prev = {};
    const visited = new Set();
    const pq = new MinHeap();
    pq.push(startId, 0);

    while (!pq.isEmpty) {
        const { val: cur, p: curDist } = pq.pop();
        if (cur === endId) break;
        if (visited.has(cur)) continue;
        visited.add(cur);

        for (const edge of (graphEdges[cur] || [])) {
            if (visited.has(edge.to)) continue;
            // Apply penalty if this edge has been used in a previous alternative
            const penalty = edgePenalties[`${cur}-${edge.to}`] || 1.0;
            const alt = curDist + (edge.dist * penalty);
            if (dist[edge.to] === undefined || alt < dist[edge.to]) {
                dist[edge.to] = alt;
                prev[edge.to] = cur;
                pq.push(edge.to, alt);
            }
        }
    }

    if (dist[endId] === undefined) return null;
    const path = [];
    let cur = endId;
    while (cur !== undefined) { path.push(cur); cur = prev[cur]; }
    path.reverse();
    return { path, distance: dist[endId] };
}

// ─── WAYPOINTS & ROUTING ─────────────────────────────────────────────────────
let waypoints  = [];   // [{id, lat, lon, marker}]
let routeLines = [];   // Leaflet polylines

function handleNodeClick(id, lat, lon) {
    if (Object.keys(graphNodes).length === 0) {
        statusEl.textContent = 'まず「この付近の登山道を取得」を押してください。';
        return;
    }
    const label = waypoints.length === 0 ? 'スタート' : `地点 ${waypoints.length}`;
    // interaction:false is crucial to allow clicking the node UNDER the marker for piston routes
    const marker = L.marker([lat, lon], { interactive: false }).addTo(map).bindPopup(label);
    waypoints.push({ id, lat, lon, marker });
    updateSidebar();

    if (waypoints.length >= 2) {
        const prev = waypoints[waypoints.length - 2];
        const curr = waypoints[waypoints.length - 1];
        drawRoute(prev, curr);
    } else {
        statusEl.textContent = '次の地点（目的地）を選んでください。';
    }
}

let currentAlternatives = []; // Current shown alternative paths

function drawRoute(from, to) {
    statusEl.textContent = 'ルート候補を計算中...';
    // Clear old alternative display
    currentAlternatives.forEach(a => map.removeLayer(a.layer));
    currentAlternatives = [];

    const penalties = {};
    const paths = [];

    // Find up to 3 alternatives using edge penalty heuristic
    for (let i = 0; i < 3; i++) {
        const res = dijkstra(from.id, to.id, penalties);
        if (!res) break;
        paths.push(res.path);
        // Penalty logic: discourage reuse of edges from the first path
        for (let j = 0; j < res.path.length - 1; j++) {
            const u = res.path[j], v = res.path[j+1];
            penalties[`${u}-${v}`] = (penalties[`${u}-${v}`] || 1) + 5.0; // heavy penalty
            penalties[`${v}-${u}`] = (penalties[`${v}-${u}`] || 1) + 5.0;
        }
    }

    if (paths.length === 0) {
        statusEl.textContent = 'ルートが見つかりませんでした。';
        undoLast(); return;
    }

    // Render alternatives
    paths.forEach((path, idx) => {
        const latlngs = path.map(id => graphNodes[id]);
        const isMain = idx === 0;
        const line = L.polyline(latlngs, {
            color: isMain ? '#E91E63' : '#9C27B0',
            weight: isMain ? 6 : 4,
            opacity: isMain ? 0.9 : 0.4,
            dashArray: isMain ? null : '5,5',
            interactive: true
        }).addTo(map);

        line.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectAlternative(idx);
        });

        currentAlternatives.push({ path, layer: line });
    });

    selectAlternative(0, true);
}

function selectAlternative(idx, isInitial = false) {
    const selected = currentAlternatives[idx];
    if (!selected) return;

    // Move selected to routeLines and update UI
    if (!isInitial) {
        // Remove currently active last route line
        const lastLine = routeLines.pop();
        if (lastLine) map.removeLayer(lastLine);
    }

    // Highlighting
    currentAlternatives.forEach((alt, i) => {
        const line = alt.layer;
        const isSelected = i === idx;
        line.setStyle({
            color: isSelected ? '#E91E63' : '#9C27B0',
            weight: isSelected ? 6 : 4,
            opacity: isSelected ? 0.9 : 0.3,
            dashArray: isSelected ? null : '5,5'
        });
        if (isSelected) line.bringToFront();
    });

    // Add high-res version to routeLines for export
    const finalLine = L.polyline(selected.path.map(id => graphNodes[id]), {
        color: '#E91E63', weight: 6, opacity: 0.9, interactive: false
    }).addTo(map);
    routeLines.push(finalLine);

    const totalDist = selected.path.reduce((sum, id, i) => {
        if (i === 0) return 0;
        const p1 = graphNodes[selected.path[i-1]], p2 = graphNodes[id];
        return sum + haversine(p1[0], p1[1], p2[0], p2[1]);
    }, 0);

    statusEl.textContent = `ルート${idx+1}を選択中 (距離: ${(totalDist/1000).toFixed(2)}km)。別の線をクリックで切替可。`;
    updateSidebar();
}

// Haversine in JS (mirrors the server-side Python)
function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const phi1 = lat1 * Math.PI / 180, phi2 = lat2 * Math.PI / 180;
    const dphi = (lat2-lat1) * Math.PI / 180;
    const dlam = (lon2-lon1) * Math.PI / 180;
    const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlam/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateSidebar() {
    const el = document.getElementById('listItems');
    if (waypoints.length === 0) { el.textContent = 'まだありません'; return; }
    el.innerHTML = waypoints.map((wp, i) =>
        `<div>● <strong>${i === 0 ? 'スタート' : `地点 ${i}`}</strong></div>`
    ).join('');
}

function undoLast() {
    if (waypoints.length > 0) {
        const wp = waypoints.pop();
        map.removeLayer(wp.marker);
    }
    if (routeLines.length > 0) {
        map.removeLayer(routeLines.pop());
    }
    updateSidebar();
    statusEl.textContent = waypoints.length >= 1
        ? '次の地点を選んでください。'
        : '地図上の白丸をクリックして開始地点を選んでください。';
}

function resetAll() {
    waypoints.forEach(wp => map.removeLayer(wp.marker));
    routeLines.forEach(l => map.removeLayer(l));
    waypoints = []; routeLines = [];
    updateSidebar();
    statusEl.textContent = '地図上の白丸をクリックして開始地点を選んでください。';
}

// ─── EXPORT ──────────────────────────────────────────────────────────────────
async function exportRoute(format) {
    if (routeLines.length === 0) { alert('ルートがありません。'); return; }
    const allPoints = [];
    routeLines.forEach(line => {
        line.getLatLngs().forEach(ll => allPoints.push({ lat: ll.lat, lon: ll.lng }));
    });
    const res = await fetch(`/export/${format}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'HikingRoute', points: allPoints })
    });
    if (!res.ok) { alert('保存に失敗しました。'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `route.${format}`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
</script>
